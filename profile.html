<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Artisana</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo">
                    <h1>Artisana<span class="gold-dot">.</span></h1>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="academy.html">Academy</a></li>
                    <li><a href="store.html">Store</a></li>
                    <li><a href="couples.html">Couples</a></li>
                    <li><a href="affiliate.html">Earn</a></li>
                </ul>
                <div class="nav-buttons">
                    <div class="user-menu">
                        <span class="user-greeting">Hi, <span id="displayName">User</span>!</span>
                        <div class="user-avatar">👤</div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <div class="container">
            <div class="profile-header">
                <h1>My Profile</h1>
                <p>Manage your account settings</p>
            </div>

            <div class="profile-grid">
                <!-- Left Column - Avatar & Stats -->
                <div class="profile-sidebar">
                    <div class="avatar-section">
                        <div class="large-avatar">👤</div>
                        <h3 id="profileName">Loading...</h3>
                        <p id="profileEmail">Loading...</p>
                        <span class="user-type-badge" id="userType">Creative Enthusiast</span>
                    </div>

                    <div class="profile-stats">
                        <div class="stat-row">
                            <span>Member since</span>
                            <strong>March 2024</strong>
                        </div>
                        <div class="stat-row">
                            <span>Courses completed</span>
                            <strong>2</strong>
                        </div>
                        <div class="stat-row">
                            <span>Total points</span>
                            <strong>1,250</strong>
                        </div>
                    </div>
                </div>

                <!-- Right Column - Edit Profile -->
                <div class="profile-main">
                    <h3>Edit Profile</h3>
                    <form class="profile-form" onsubmit="return updateProfile(event)">
                        <div class="form-row">
                            <div class="form-group half">
                                <label>First Name</label>
                                <input type="text" id="firstName" class="form-control" value="John">
                            </div>
                            <div class="form-group half">
                                <label>Last Name</label>
                                <input type="text" id="lastName" class="form-control" value="Doe">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Display Name</label>
                            <input type="text" id="displayName" class="form-control" value="JohnDoe">
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="email" class="form-control" value="john@example.com" readonly>
                        </div>

                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210">
                        </div>

                        <div class="form-group">
                            <label>Bio</label>
                            <textarea class="form-control" rows="4" placeholder="Tell us about yourself...">I love creating art and sharing with others!</textarea>
                        </div>

                        <div class="form-group">
                            <label>Interests</label>
                            <div class="interests-grid">
                                <label class="interest-tag">
                                    <input type="checkbox" checked> Watercolor
                                </label>
                                <label class="interest-tag">
                                    <input type="checkbox"> Calligraphy
                                </label>
                                <label class="interest-tag">
                                    <input type="checkbox" checked> Digital Art
                                </label>
                                <label class="interest-tag">
                                    <input type="checkbox"> Paper Craft
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            document.getElementById('profileName').textContent = localStorage.getItem('userName') || 'John Doe';
            document.getElementById('profileEmail').textContent = localStorage.getItem('userEmail') || 'john@example.com';
            
            const userType = localStorage.getItem('userType') || 'enthusiast';
            const typeLabels = {
                'enthusiast': 'Creative Enthusiast',
                'entrepreneur': 'Aspiring Entrepreneur',
                'learner': 'Skill Builder'
            };
            document.getElementById('userType').textContent = typeLabels[userType] || 'Creative Enthusiast';
        }

        function updateProfile(event) {
            event.preventDefault();
            alert('Profile updated successfully!');
            return false;
        }
    </script>
</body>
</html>
